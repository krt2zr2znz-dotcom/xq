    +'<span class="kchip" style="background:#eee;color:#666">┈平盤</span>'+(entry>0?'<span class="kchip" style="background:#eef;color:#1F60C0">┈進場</span>':'')
    +'<span class="kchip" style="background:#efe9fd;color:#7b3ff2">當天平均線(均價)</span>'
    +' ｜ 疊圖線:<b style="color:#111">個股</b> / <b style="color:#e08a1e">加權</b> / <b style="color:#8a4fbf">櫃買</b>';
  if(!tw&&!oc) leg+=' <span style="color:#a55">(此日大盤/櫃買5分K無:指數1分K僅近期才有)</span>';
  document.getElementById('kleg').innerHTML=leg;
  drawCandle('kc_stock',sk,[{p:sigClose,color:'#999',label:'平盤'},{p:entry,color:'#1F60C0',label:'進場'}],-1);
  drawCandle('kc_twii',tw,[],-1);
  drawCandle('kc_otc',oc,[],-1);
  drawOverlay('kc_ov',[{name:'個股',k:sk,color:'#111'},{name:'加權',k:tw,color:'#e08a1e'},{name:'櫃買',k:oc,color:'#8a4fbf'}],-1);
  document.getElementById('kmask').style.display='flex';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeK();});
(function(){
  attachHover('kc_stock',false);attachHover('kc_twii',false);attachHover('kc_otc',false);attachHover('kc_ov',true);
  var tip=document.getElementById('bktip');
  document.getElementById('wrap').addEventListener('click',function(e){
    var th=(e.target.closest?e.target.closest('thead th'):null);
    if(th){_sortDT(th);tip.style.display='none';return;}   // 點欄位標題排序
    var bk=(e.target.closest?e.target.closest('.bk'):null);
    if(bk){   // 點分點 → 顯示該分點在這檔的買超張+買均價(訊號日T)
      var nm=bk.getAttribute('data-nm'),buy=bk.getAttribute('data-buy'),bp=parseFloat(bk.getAttribute('data-bp'))||0;
      tip.innerHTML='<span class="nm">'+nm+'</span><br>買超 <b>'+buy+'</b> 張 ｜ 買均價 <b>'+(bp>0?bp.toFixed(2):'—')+'</b>';
      tip.style.display='block';
      var r=bk.getBoundingClientRect(),tw=Math.min(210,window.innerWidth-12);
      var tx=Math.min(r.left,window.innerWidth-tw-6),ty=r.bottom+6;
      if(ty>window.innerHeight-52)ty=r.top-50;
      tip.style.left=Math.max(6,tx)+'px';tip.style.top=Math.max(6,ty)+'px';
      e.stopPropagation();return;
    }
    var td=(e.target.closest?e.target.closest('.klink'):null);
    if(!td)return; var p=(td.getAttribute('data-k')||'').split('|');
    if(p.length>=4) openK(p[0],p[1],parseFloat(p[2]),parseFloat(p[3]));
  });
  document.addEventListener('click',function(e){   // 點別處收起分點小卡
    if(!e.target.closest||!e.target.closest('.bk'))tip.style.display='none';
  });
  var sel=document.getElementById('dsel');
  var op='<option value="ALL">全部(整月成績單)</option>';
  DATES.forEach(function(d){op+='<option value="'+d+'">'+d+'</option>';});
  sel.innerHTML=op;
  sel.onchange=function(){render(sel.value);};
  render(DATES.length?DATES[0]:'ALL');
})();
</script>
</body></html>
