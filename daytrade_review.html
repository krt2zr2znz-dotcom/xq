  if(hoverIdx>=0&&hoverIdx<N){var x=X(hoverIdx);g.strokeStyle='#c3c9d4';g.setLineDash([3,3]);g.beginPath();g.moveTo(x,mT);g.lineTo(x,mT+ph);g.stroke();g.setLineDash([]);
    g.fillStyle='#1a2233';g.fillText(k.t[hoverIdx]+' 開'+k.o[hoverIdx].toFixed(2)+' 高'+k.h[hoverIdx].toFixed(2)+' 低'+k.l[hoverIdx].toFixed(2)+' 收'+k.c[hoverIdx].toFixed(2),mL,mT-7);}
  else {g.fillStyle='#8a93a3';g.fillText('紅漲綠跌·移游標看每根開高低收',mL,mT-7);}
}
function pctOpen(k){var b=(k.o&&k.o[0])||k.c[0];return k.c.map(function(c){return (c/b-1)*100;});}
function drawOverlay(cid,series,hoverIdx){
  var cv=document.getElementById(cid),g=cv.getContext('2d'),W=cv.width,H=cv.height;
  var mL=44,mR=12,mT=20,mB=26,pw=W-mL-mR,ph=H-mT-mB;
  g.clearRect(0,0,W,H);g.fillStyle='#fff';g.fillRect(0,0,W,H);
  var use=series.filter(function(s){return s.k&&s.k.t&&s.k.t.length;});
  _CH[cid]={ov:use};
  if(!use.length){_noData(g,W,H,'無資料');return;}
  var lo=1e9,hi=-1e9,Nmax=0;
  use.forEach(function(s){s.p=pctOpen(s.k);s.p.forEach(function(v){if(v<lo)lo=v;if(v>hi)hi=v;});Nmax=Math.max(Nmax,s.p.length);});
  var pad=(hi-lo)*0.12||0.3;lo-=pad;hi+=pad;
  function Y(v){return mT+ph-(v-lo)/(hi-lo)*ph;}
  g.font='10px sans-serif';g.textAlign='right';
  for(var q=0;q<=4;q++){var v=lo+(hi-lo)*q/4,y=Y(v);g.strokeStyle=(Math.abs(v)<1e-6)?'#d7dde6':'#eef1f5';g.beginPath();g.moveTo(mL,y);g.lineTo(W-mR,y);g.stroke();g.fillStyle='#99a';g.fillText((v>=0?'+':'')+v.toFixed(1)+'%',mL-3,y+3);}
  var y0=Y(0);g.strokeStyle='#c3c9d4';g.setLineDash([4,3]);g.beginPath();g.moveTo(mL,y0);g.lineTo(W-mR,y0);g.stroke();g.setLineDash([]);
  use.forEach(function(s){var M=s.p.length;g.strokeStyle=s.color;g.lineWidth=1.7;g.beginPath();for(var j=0;j<M;j++){var x=mL+(j+0.5)/M*pw,y=Y(s.p[j]);if(j===0)g.moveTo(x,y);else g.lineTo(x,y);}g.stroke();g.lineWidth=1;});
  // 圖例
  g.font='11px sans-serif';g.textAlign='left';var lx=mL+2;
  use.forEach(function(s){g.fillStyle=s.color;g.fillRect(lx,mT-13,10,4);g.fillStyle='#445';g.fillText(s.name,lx+13,mT-7);lx+=13+g.measureText(s.name).width+14;});
  if(hoverIdx>=0){var xN=Nmax; var xx=mL+(hoverIdx+0.5)/xN*pw;g.strokeStyle='#c3c9d4';g.setLineDash([3,3]);g.beginPath();g.moveTo(xx,mT);g.lineTo(xx,mT+ph);g.stroke();g.setLineDash([]);
    var parts=[]; use.forEach(function(s){if(hoverIdx<s.p.length)parts.push(s.name+(s.p[hoverIdx]>=0?' +':' ')+s.p[hoverIdx].toFixed(2)+'%');});
    g.fillStyle='#1a2233';g.textAlign='left';g.fillText(parts.join('   '),mL,H-4);}
}
function attachHover(cid,isOv){var cv=document.getElementById(cid);
  cv.onmousemove=function(e){var st=_CH[cid];if(!st)return;var rect=cv.getBoundingClientRect(),sx=cv.width/rect.width,mx=(e.clientX-rect.left)*sx;var mL=(isOv?44:46),mR=12,pw=cv.width-mL-mR;
    var N=isOv?Math.max.apply(null,(st.ov||[{p:[0]}]).map(function(s){return (s.p||[0]).length;})):((st.k&&st.k.t)?st.k.t.length:0);
    if(!N)return;var idx=Math.floor((mx-mL)/pw*N);if(isOv)drawOverlay(cid,st.ov,idx);else drawCandle(cid,st.k,st.refs,idx);};
  cv.onmouseleave=function(){var st=_CH[cid];if(!st)return;if(isOv)drawOverlay(cid,st.ov,-1);else drawCandle(cid,st.k,st.refs,-1);};
}
