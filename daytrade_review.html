function bcell(bl,lim){ // 綠(距漲停<=0.5%)先·紅後,各自買均價大->小
  if(!bl.length) return '—';
  var g=[],rd=[];
  bl.forEach(function(b){
    var bp=(b.length>3?b[3]:0)||0;
    var isg=(lim>0&&bp>0&&(lim-bp)/lim*100<=0.5);
    var col=isg?'#19c37d':'#ff5d5d';
    var sp='<span class="bk" data-nm="'+b[0]+'" data-buy="'+Math.round(b[2])+'" data-bp="'+bp+'">'+b[0]+' <b>'+b[1].toFixed(1)+'%</b>('+Math.round(b[2])+'張) <span style="color:'+col+';font-weight:700">@'+(bp>0?bp.toFixed(2):'—')+'</span></span>';
    (isg?g:rd).push([bp,sp]);
  });
  g.sort(function(a,b){return b[0]-a[0];}); rd.sort(function(a,b){return b[0]-a[0];});
  var lines=[];
  if(g.length) lines.push(g.map(function(x){return x[1];}).join(' / '));
  if(rd.length) lines.push(rd.map(function(x){return x[1];}).join(' / '));
  return lines.join('<br>');
}

function ndcells(nd,sigc){
  if(!nd) return '<td class="wt">待確認</td><td>—</td><td>—</td><td>—</td><td><span class="wt">待確認</span></td><td>—</td>';
  var o=nd[0],c=nd[1],l=nd[2],hi=nd[3],ok=nd[4];
  var v='<td>'+o.toFixed(2)+'</td><td>'+c.toFixed(2)+'</td><td>'+l.toFixed(2)+'</td><td>'+hi.toFixed(2)+'</td>';
  v+='<td>'+(ok?'<span class="ok">符合</span>':'<span class="no">不符合</span>')+'</td>';
  var ndchg=(sigc>0)?((c-sigc)/sigc*100):0;
  v+='<td class="'+(ndchg>=0?'pos':'neg')+'">'+(ndchg>=0?'+':'')+ndchg.toFixed(2)+'%</td>';
  return v;
}
function dumpcells(dp){ // 倒貨% | 進場價 | 出場價 | 來回損益
  if(dp==='wait') return '<td class="wt">待確認</td><td>—</td><td>—</td><td class="wt">待確認</td>';
  if(!dp) return '<td>—</td><td>—</td><td>—</td><td>—</td>';   // 快取待更新(無買賣均價)
  var pct=dp[0],en=dp[1],ex=dp[2],pnl=dp[3];
  var exs=ex>0?ex.toFixed(2):'—';
  var best=(pct>=100 && ex>0 && pnl<=-3);   // 倒貨100% + 隔沖大賠(≤−3%)=倒光又崩,最佳放空樣本
  var pctc='<td'+(best?' class="best"':'')+'><b>'+Math.round(pct)+'%</b>'+(best?' 🎯':'')+'</td>';
  var pnls=ex>0?('<td class="'+(pnl>=0?'pos':'neg')+(best?' best':'')+'">'+(pnl>=0?'+':'')+pnl.toFixed(1)+'%</td>'):'<td>—</td>';
  return pctc+'<td>'+en.toFixed(2)+'</td><td>'+exs+'</td>'+pnls;
}
function boomcell(sid,nd){ // 隔日 09:00 第一根5分K量 ÷ 當日5分K均量;>=2倍=開盤爆量(隔沖倒貨訊號)
  var k=nd&&KDATA[sid+'|'+nd];
  if(!k||!k.v||!k.v.length) return '<td>—</td>';
  var v=k.v,op=v[0],s=0;for(var i=0;i<v.length;i++)s+=v[i];var avg=s/v.length;
  if(!(avg>0)) return '<td>—</td>';
  var r=op/avg;
  return '<td data-v="'+r.toFixed(2)+'"'+(r>=2?' class="best"':'')+'>'+(r>=2?'🔥':'')+r.toFixed(1)+'×</td>';
}

function _sortDT(th){var t=th.closest('table'),tb=t.tBodies[0];if(!tb)return;var idx=[].indexOf.call(th.parentNode.children,th),asc=th._asc=!th._asc;
  var rs=[].slice.call(tb.rows).filter(function(r){return r.cells.length>idx&&!/empty/.test((r.firstElementChild&&r.firstElementChild.className)||'');});
  rs.sort(function(a,b){var x=a.cells[idx],y=b.cells[idx];if(!x||!y)return 0;var xv=x.getAttribute('data-v');if(xv==null)xv=x.innerText;var yv=y.getAttribute('data-v');if(yv==null)yv=y.innerText;
    var nx=parseFloat((''+xv).replace(/[^-0-9.]/g,'')),ny=parseFloat((''+yv).replace(/[^-0-9.]/g,''));
    if(!isNaN(nx)&&!isNaN(ny))return asc?nx-ny:ny-nx;return asc?(''+xv).localeCompare(yv):(''+yv).localeCompare(xv);});
  rs.forEach(function(r){tb.appendChild(r);});}

function _noData(g,W,H,msg){g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#aab';g.font='13px sans-serif';g.textAlign='center';g.fillText(msg||'無此日5分K資料',W/2,H/2);g.textAlign='left';}
function drawCandle(cid,k,refs,hoverIdx){
  var cv=document.getElementById(cid),g=cv.getContext('2d'),W=cv.width,H=cv.height;
  var mL=46,mR=12,mT=20,mB=26,pw=W-mL-mR,ph=H-mT-mB;
  var volH=(k&&k.v&&k.v.length)?38:0; ph-=volH;   // 底部保留量柱區(有量才畫)
  g.clearRect(0,0,W,H);g.fillStyle='#fff';g.fillRect(0,0,W,H);
  _CH[cid]={k:k,refs:refs};
  if(!k||!k.t||!k.t.length){_noData(g,W,H,'此日無5分K(指數1分K僅近期有)');return;}
  var N=k.t.length,lo=Math.min.apply(null,k.l),hi=Math.max.apply(null,k.h);
  (refs||[]).forEach(function(r){if(r.p>0){lo=Math.min(lo,r.p);hi=Math.max(hi,r.p);}});
  var pad=(hi-lo)*0.05||1;lo-=pad;hi+=pad;
  function Y(p){return mT+ph-(p-lo)/(hi-lo)*ph;}
  function X(i){return mL+(i+0.5)/N*pw;}
  g.font='10px sans-serif';g.textAlign='right';
  for(var q=0;q<=4;q++){var p=lo+(hi-lo)*q/4,y=Y(p);g.strokeStyle='#eef1f5';g.beginPath();g.moveTo(mL,y);g.lineTo(W-mR,y);g.stroke();g.fillStyle='#99a';g.fillText(p.toFixed(2),mL-3,y+3);}
  g.textAlign='center';g.fillStyle='#99a';
  for(var i=0;i<N;i++){var mm=k.t[i].slice(3);if(mm==='00'||mm==='30')g.fillText(k.t[i],X(i),H-mB+13);}
  (refs||[]).forEach(function(r){if(r.p<=0)return;var y=Y(r.p);g.strokeStyle=r.color;g.setLineDash([5,4]);g.beginPath();g.moveTo(mL,y);g.lineTo(W-mR,y);g.stroke();g.setLineDash([]);g.fillStyle=r.color;g.textAlign='left';g.fillText(r.label+' '+r.p.toFixed(2),mL+3,y-2);});
  var bw=Math.max(2,pw/N*0.62);
  for(var i=0;i<N;i++){var o=k.o[i],h=k.h[i],l=k.l[i],c=k.c[i],up=(c>=o),col=up?'#d0021b':'#0a8f3c',x=X(i);
    g.strokeStyle=col;g.beginPath();g.moveTo(x,Y(h));g.lineTo(x,Y(l));g.stroke();
    g.fillStyle=col;var y1=Y(Math.max(o,c)),y2=Y(Math.min(o,c));g.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1));}
  // 量柱(底部)+ 09:00爆量標記
  if(volH>0){var vmax=Math.max.apply(null,k.v)||1,vb=mT+ph,s=0;
    for(var i=0;i<N;i++){var vh=(k.v[i]/vmax)*(volH-6),up=(k.c[i]>=k.o[i]);g.fillStyle=up?'#f2b0b0':'#a6d3ad';g.fillRect(X(i)-bw/2,vb+volH-vh,bw,Math.max(1,vh));s+=k.v[i];}
    var avg=s/N;
    if(avg>0&&k.v[0]>=2*avg){g.fillStyle='#c0261b';g.font='10px sans-serif';g.textAlign='left';g.fillText('🔥09:00爆量 '+(k.v[0]/avg).toFixed(1)+'×',mL+2,vb+11);}
    g.fillStyle='#99a';g.font='10px sans-serif';g.textAlign='right';g.fillText('量',mL-3,vb+11);}
  // 當天平均線(均價線/VWAP)
  if(k.vw&&k.vw.length){g.strokeStyle='#7b3ff2';g.lineWidth=1.6;g.beginPath();var st=false;for(var i=0;i<N;i++){var vv=k.vw[i];if(vv==null)continue;var x=X(i),y=Y(vv);if(!st){g.moveTo(x,y);st=true;}else g.lineTo(x,y);}g.stroke();g.lineWidth=1;}
  g.font='11px sans-serif';g.textAlign='left';
  if(hoverIdx>=0&&hoverIdx<N){var x=X(hoverIdx);g.strokeStyle='#c3c9d4';g.setLineDash([3,3]);g.beginPath();g.moveTo(x,mT);g.lineTo(x,mT+ph);g.stroke();g.setLineDash([]);
    g.fillStyle='#1a2233';g.fillText(k.t[hoverIdx]+' 開'+k.o[hoverIdx].toFixed(2)+' 高'+k.h[hoverIdx].toFixed(2)+' 低'+k.l[hoverIdx].toFixed(2)+' 收'+k.c[hoverIdx].toFixed(2),mL,mT-7);}
  else {g.fillStyle='#8a93a3';g.fillText('紅漲綠跌·移游標看每根開高低收',mL,mT-7);}
}
function pctOpen(k){var b=(k.o&&k.o[0])||k.c[0];return k.c.map(function(c){return (c/b-1)*100;});}
function drawOverlay(cid,series,hoverIdx){
  var cv=document.getElementById(cid),g=cv.getContext('2d'),W=cv.width,H=cv.height;
  var mL=44,mR=12,mT=20,mB=26,pw=W-mL-mR,ph=H-mT-mB;
  g.clearRect(0,0,W,H);g.fillStyle='#fff';g.fillRect(0,0,W,H);
  var use=series.filter(function(s){return s.k&&s.k.t&&s.k.t.length;});
  _CH[cid]={ov:use};
  if(!use.length){_noData(g,W,H,'無資料');return;}
  var lo=1e9,hi=-1e9,Nmax=0;
  use.forEach(function(s){s.p=pctOpen(s.k);s.p.forEach(function(v){if(v<lo)lo=v;if(v>hi)hi=v;});Nmax=Math.max(Nmax,s.p.length);});
  var pad=(hi-lo)*0.12||0.3;lo-=pad;hi+=pad;
  function Y(v){return mT+ph-(v-lo)/(hi-lo)*ph;}
  g.font='10px sans-serif';g.textAlign='right';
  for(var q=0;q<=4;q++){var v=lo+(hi-lo)*q/4,y=Y(v);g.strokeStyle=(Math.abs(v)<1e-6)?'#d7dde6':'#eef1f5';g.beginPath();g.moveTo(mL,y);g.lineTo(W-mR,y);g.stroke();g.fillStyle='#99a';g.fillText((v>=0?'+':'')+v.toFixed(1)+'%',mL-3,y+3);}
  var y0=Y(0);g.strokeStyle='#c3c9d4';g.setLineDash([4,3]);g.beginPath();g.moveTo(mL,y0);g.lineTo(W-mR,y0);g.stroke();g.setLineDash([]);
  use.forEach(function(s){var M=s.p.length;g.strokeStyle=s.color;g.lineWidth=1.7;g.beginPath();for(var j=0;j<M;j++){var x=mL+(j+0.5)/M*pw,y=Y(s.p[j]);if(j===0)g.moveTo(x,y);else g.lineTo(x,y);}g.stroke();g.lineWidth=1;});
  // 圖例
  g.font='11px sans-serif';g.textAlign='left';var lx=mL+2;
  use.forEach(function(s){g.fillStyle=s.color;g.fillRect(lx,mT-13,10,4);g.fillStyle='#445';g.fillText(s.name,lx+13,mT-7);lx+=13+g.measureText(s.name).width+14;});
  if(hoverIdx>=0){var xN=Nmax; var xx=mL+(hoverIdx+0.5)/xN*pw;g.strokeStyle='#c3c9d4';g.setLineDash([3,3]);g.beginPath();g.moveTo(xx,mT);g.lineTo(xx,mT+ph);g.stroke();g.setLineDash([]);
    var parts=[]; use.forEach(function(s){if(hoverIdx<s.p.length)parts.push(s.name+(s.p[hoverIdx]>=0?' +':' ')+s.p[hoverIdx].toFixed(2)+'%');});
    g.fillStyle='#1a2233';g.textAlign='left';g.fillText(parts.join('   '),mL,H-4);}
}
function attachHover(cid,isOv){var cv=document.getElementById(cid);
  cv.onmousemove=function(e){var st=_CH[cid];if(!st)return;var rect=cv.getBoundingClientRect(),sx=cv.width/rect.width,mx=(e.clientX-rect.left)*sx;var mL=(isOv?44:46),mR=12,pw=cv.width-mL-mR;
    var N=isOv?Math.max.apply(null,(st.ov||[{p:[0]}]).map(function(s){return (s.p||[0]).length;})):((st.k&&st.k.t)?st.k.t.length:0);
    if(!N)return;var idx=Math.floor((mx-mL)/pw*N);if(isOv)drawOverlay(cid,st.ov,idx);else drawCandle(cid,st.k,st.refs,idx);};
  cv.onmouseleave=function(){var st=_CH[cid];if(!st)return;if(isOv)drawOverlay(cid,st.ov,-1);else drawCandle(cid,st.k,st.refs,-1);};
}

    var bk=(e.target.closest?e.target.closest('.bk'):null);
    if(bk){   // 點分點 → 顯示該分點在這檔的買超張+買均價(訊號日T)
      var nm=bk.getAttribute('data-nm'),buy=bk.getAttribute('data-buy'),bp=parseFloat(bk.getAttribute('data-bp'))||0;
      tip.innerHTML='<span class="nm">'+nm+'</span><br>買超 <b>'+buy+'</b> 張 ｜ 買均價 <b>'+(bp>0?bp.toFixed(2):'—')+'</b>';
      tip.style.display='block';
      var r=bk.getBoundingClientRect(),tw=Math.min(210,window.innerWidth-12);
      var tx=Math.min(r.left,window.innerWidth-tw-6),ty=r.bottom+6;
      if(ty>window.innerHeight-52)ty=r.top-50;
      tip.style.left=Math.max(6,tx)+'px';tip.style.top=Math.max(6,ty)+'px';
      e.stopPropagation();return;
    }
    var td=(e.target.closest?e.target.closest('.klink'):null);
    if(!td)return; var p=(td.getAttribute('data-k')||'').split('|');
    if(p.length>=4) openK(p[0],p[1],parseFloat(p[2]),parseFloat(p[3]));
  });
  document.addEventListener('click',function(e){   // 點別處收起分點小卡
    if(!e.target.closest||!e.target.closest('.bk'))tip.style.display='none';
  });
  var sel=document.getElementById('dsel');
  var op='<option value="ALL">全部(整月成績單)</option>';
  DATES.forEach(function(d){op+='<option value="'+d+'">'+d+'</option>';});
  sel.innerHTML=op;
  sel.onchange=function(){render(sel.value);};
  render(DATES.length?DATES[0]:'ALL');
})();
</script>
