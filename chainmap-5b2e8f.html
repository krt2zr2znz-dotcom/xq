}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1760px;margin:0 auto;padding-inline:16px;padding-block:26px 60px}
h1{font-weight:900;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.02em}
h2{font-size:20px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--flat)}

.verdict{border-left:4px solid var(--hot)}
.pk{cursor:pointer}.pk:hover{filter:brightness(.92);text-decoration:underline}

.tools input,.tools select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
#q{min-width:240px}

.cbody{padding:0 16px 16px}

// 子產業層級:從 stock 的層級欄位推回(主屬性的層級);沒有就用 subs 的
const LV={}; J.subs.forEach(s=>LV[s.i+'|'+s.s]=s.lv);
Object.values(J.stock).forEach(v=>{const k=v[1]+'|'+v[2]; if(!LV[k]) LV[k]=v[10];});
// 產業鏈 → 子產業
const CH={}; Object.keys(J.all).forEach(k=>{const [i,s]=k.split('|'); (CH[i]=CH[i]||[]).push(s);});
function lvOf(i,s){return LV[i+'|'+s]||guess(s);}
function guess(s){if(/材料|原料|原物料|晶片|IC|元件|零組件|零件|鋼材|燃料/.test(s))return '上游'; if(/通路|零售|銷售|代理|顧問|服務|營運|電廠|醫療院所|餐飲/.test(s))return '下游'; if(/設備/.test(s))return '設備/材料'; return '中游';}
function chainScore(i){const ss=CH[i].map(s=>SUB[i+'|'+s]).filter(Boolean); const h=ss.filter(x=>x.st==='發動').length, t=ss.filter(x=>x.st==='轉強').length;
  const r=ss.map(x=>x.r20).sort((a,b)=>a-b); return {h,t,n:ss.length,med:r.length?r[Math.floor(r.length/2)]:null};}
function memRows(i,s){
  const cs=J.all[i+'|'+s]||[]; const rows=cs.map(c=>({c,v:J.stock[c]})).filter(x=>x.v);
  rows.sort((a,b)=>((b.v[1]===i&&b.v[2]===s)-(a.v[1]===i&&a.v[2]===s))||((b.v[6]??-999)-(a.v[6]??-999)));
  return '<table><thead><tr><th>代碼</th><th>名稱</th><th>20日%</th><th>5日%</th><th>距60日高</th><th>均量(張)</th><th>主屬性</th><th>營收比重</th></tr></thead><tbody>'+
   rows.map(({c,v})=>{const pri=v[1]===i&&v[2]===s; return '<tr><td class="num"><span class="sc" data-c="'+c+'">'+c+'</span>'+(REC.has(c)?' 📼':'')+'</td><td><span class="sc" data-c="'+c+'">'+(pri?'<span class="pri">'+esc(v[0])+'</span>':esc(v[0]))+'</span></td><td class="num '+cls(v[6])+'">'+fmt(v[6])+'</td><td class="num '+cls(v[5])+'">'+fmt(v[5])+'</td><td class="num">'+(v[7]==null?'—':(v[7]-100).toFixed(0)+'%')+'</td><td class="num">'+(v[8]||0).toLocaleString()+'</td><td>'+(pri?'<b>是</b>·'+esc(v[3]):'<span class="sub">'+esc(v[2])+'</span>')+'</td><td class="rev">'+esc((v[4]||'').replace(/\s*\(\d{4}年\)/,''))+'</td></tr>';}).join('')+'</tbody></table>';
}
function node(i,s){const x=SUB[i+'|'+s]; const n=(J.all[i+'|'+s]||[]).length; const npri=(J.all[i+'|'+s]||[]).filter(c=>J.stock[c]&&J.stock[c][1]===i&&J.stock[c][2]===s).length;
  return '<details class="node" data-k="'+esc(i+'|'+s)+'"><summary><span class="nname">'+esc(s)+'</span>'+(x?'<span class="pill '+PILL[x.st]+'">'+x.st+'</span>':'<span class="pill p-na">無股價</span>')+
   '<span class="nmet">'+(x?'<span>20日 <b class="num '+cls(x.r20)+'">'+fmt(x.r20)+'%</b></span><span>5日 <span class="num '+cls(x.r5)+'">'+fmt(x.r5)+'%</span></span><span>站上月線 <span class="num">'+x.br+'%</span></span>':'')+'<span>'+n+' 檔(主屬性 '+npri+')</span></span></summary></details>';}
function chainHTML(i,open){const sc=chainScore(i); const by={}; CH[i].forEach(s=>{(by[lvOf(i,s)]=by[lvOf(i,s)]||[]).push(s);});
  const SO={'發動':4,'轉強':3,'整理':2,'落後':1}, sv=s=>{const x=SUB[i+'|'+s];return x?SO[x.st]*1000+x.r20:-1e9;};
  const ON=new Set([...document.querySelectorAll('#stf input:checked')].map(x=>x.value));     // 子族群勾選(預設全勾)
  LVS.forEach(l=>{by[l]=(by[l]||[]).filter(s=>{const x=SUB[i+'|'+s];return x?ON.has(x.st):ON.size===4;}).sort((a,b)=>sv(b)-sv(a));});
  const nc=l=>((by[l]||[]).length>4?2:1), gt=LVS.map(l=>nc(l)+'fr').join(' ');
  return '<details class="chain" data-i="'+esc(i)+'"'+(open?' open':'')+'><summary><h2>'+esc(i)+'</h2>'+(sc.h?'<span class="pill p-hot pk" data-st="發動" title="點我看發動子產業的個股">發動 '+sc.h+' ▾</span>':'')+(sc.t?'<span class="pill p-up pk" data-st="轉強" title="點我看轉強子產業的個股">轉強 '+sc.t+' ▾</span>':'')+
   '<span class="sub">'+CH[i].length+' 個子產業'+(sc.med!=null?' · 有算強弱的 '+sc.n+' 個,20 日中位數 <b class="num '+cls(sc.med)+'">'+fmt(sc.med)+'%</b>':'')+'</span></summary><div class="cbody"><div class="panel"></div><div class="tiers" style="grid-template-columns:'+gt+'">'+
   LVS.map(l=>'<div class="tier"><div class="tier-lab">'+l+' <span class="sub">'+(by[l]||[]).length+'</span></div><div class="tbody" style="grid-template-columns:repeat('+nc(l)+',minmax(0,1fr))">'+((by[l]||[]).map(s=>node(i,s)).join('')||'<div class="sub">—</div>')+'</div></div>').join('')+'</div></div></details>';}
function draw(){const so=document.getElementById('sort').value, only=document.getElementById('only').checked;
  let ks=Object.keys(CH); if(only) ks=ks.filter(i=>{const s=chainScore(i);return s.h+s.t>0;});
  ks.sort((a,b)=>{const A=chainScore(a),B=chainScore(b); if(so==='name')return a.localeCompare(b,'zh-Hant'); if(so==='r20')return (B.med??-99)-(A.med??-99); return (B.h*3+B.t)-(A.h*3+A.t)||((B.med??-99)-(A.med??-99));});
  document.getElementById('chains').innerHTML=ks.map((i,k)=>chainHTML(i,k<3)).join('');}
document.getElementById('chains').addEventListener('toggle',e=>{const d=e.target; if(!(d.classList&&d.classList.contains('node')))return;
  const ch=d.closest('.chain'), pn=ch.querySelector('.panel');
  if(d.open){ch.querySelectorAll('details.node[open]').forEach(x=>{if(x!==d)x.open=false;}); const [i,s]=d.dataset.k.split('|');
    setTimeout(()=>pn.scrollIntoView({behavior:'smooth',block:'start'}),30);
    pn.innerHTML='<div class="ptitle"><b>'+esc(s)+'</b> <span class="sub">'+esc(i)+' · '+lvOf(i,s)+' · 名稱藍色 = 主屬性就是這個子產業</span></div><div class="mem">'+memRows(i,s)+'</div>';}
  else if(!ch.querySelector('details.node[open]')) pn.innerHTML='';},true);
// 10/4:點產業鏈標題上的「發動 n / 轉強 n」→ 下方列出那些子產業的個股
document.getElementById('chains').addEventListener('click',e=>{const pk=e.target.closest('.pk'); if(!pk)return; e.preventDefault(); e.stopPropagation();
  const ch=pk.closest('.chain'), i=ch.dataset.i, st=pk.dataset.st, pn=ch.querySelector('.panel'); ch.open=true;
  ch.querySelectorAll('details.node[open]').forEach(x=>x.open=false);
  const ss=CH[i].filter(s=>SUB[i+'|'+s]&&SUB[i+'|'+s].st===st).sort((a,b)=>SUB[i+'|'+b].r20-SUB[i+'|'+a].r20);
  pn.innerHTML='<div class="ptitle"><b>'+esc(i)+' · '+st+' '+ss.length+' 個子產業的個股</b> <span class="sub">名稱藍色 = 主屬性就是這個子產業</span></div>'+
    ss.map(s=>{const x=SUB[i+'|'+s];return '<div class="ptitle" style="margin-top:10px"><b>'+esc(s)+'</b> <span class="sub">'+lvOf(i,s)+' · 20日 '+fmt(x.r20)+'% · 5日 '+fmt(x.r5)+'% · 站上月線 '+x.br+'%</span></div><div class="mem">'+memRows(i,s)+'</div>';}).join('');
  pn.scrollIntoView({behavior:'smooth',block:'nearest'});},true);
document.querySelectorAll('#stf input').forEach(x=>x.onchange=draw);
document.getElementById('sort').onchange=draw; document.getElementById('only').onchange=draw;
// 查詢
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.trim(); const el=document.getElementById('hit'); if(!q){el.innerHTML='';return;}
  const hs=Object.entries(J.stock).filter(([c,v])=>c.startsWith(q)||v[0].includes(q)).slice(0,8);
  let h='';
  hs.forEach(([c,v])=>{const all=Object.keys(J.all).filter(k=>J.all[k].includes(c));
    h+='<div class="box" style="margin-bottom:8px"><b class="num sc" data-c="'+c+'">'+c+'</b> <b class="sc" data-c="'+c+'">'+esc(v[0])+'</b> <span class="sub">(點代碼看撐壓)</span> · 主屬性 <span class="pri">'+esc(v[1])+' / '+esc(v[2])+'('+esc(v[10])+')</span> <span class="sub">'+esc(v[3])+'</span> · 20日 <span class="num '+cls(v[6])+'">'+fmt(v[6])+'%</span><div class="sub">營收比重:'+esc(v[4]||'無資料')+'</div><div class="sub">全部分類:'+all.map(k=>{const x=SUB[k];return esc(k.replace('|',' / '))+(x?'('+x.st+')':'');}).join('、')+'</div></div>';});
  const sm=Object.keys(J.all).filter(k=>k.includes(q)).slice(0,20);
  if(sm.length) h+='<div class="sub" style="margin-bottom:6px">子產業:'+sm.map(k=>{const x=SUB[k];return '<mark>'+esc(k.replace('|',' / '))+'</mark>'+(x?' '+x.st:'');}).join(' · ')+'</div>';
  el.innerHTML=h||'<div class="sub">找不到</div>';});
// 子產業表
let sk='r20',asc=false; const ORD={'發動':4,'轉強':3,'整理':2,'落後':1};
function drawAll(){const rows=[...J.subs].sort((a,b)=>{let x=sk==='st'?ORD[a.st]:a[sk],y=sk==='st'?ORD[b.st]:b[sk]; if(typeof x==='string')return asc?x.localeCompare(y,'zh-Hant'):y.localeCompare(x,'zh-Hant'); return asc?x-y:y-x;});
  document.getElementById('nall').textContent=J.subs.length;
  document.querySelector('#all tbody').innerHTML=rows.map(r=>'<tr data-k="'+esc(r.i+'|'+r.s)+'"><td>'+esc(r.s)+'</td><td>'+esc(r.i)+'</td><td>'+r.lv+'</td><td><span class="pill '+PILL[r.st]+'">'+r.st+'</span></td><td class="num">'+r.n+'</td><td class="num '+cls(r.r5)+'">'+fmt(r.r5)+'</td><td class="num '+cls(r.r20)+'">'+fmt(r.r20)+'</td><td class="num">'+r.br+'</td></tr>').join('');}
document.querySelectorAll('#all th').forEach(th=>th.onclick=()=>{const k=th.dataset.k; if(sk===k)asc=!asc; else {sk=k; asc=(k==='s'||k==='i'||k==='lv');} drawAll();});
document.querySelector('#all tbody').addEventListener('click',e=>{const tr=e.target.closest('tr'); if(!tr)return; const [i,s]=tr.dataset.k.split('|');
  if(document.getElementById('only').checked&&!document.querySelector('.chain[data-i="'+CSS.escape(i)+'"]')){document.getElementById('only').checked=false; draw();}
  const ch=document.querySelector('.chain[data-i="'+CSS.escape(i)+'"]'); if(!ch)return; ch.open=true;
  const nd=ch.querySelector('details.node[data-k="'+CSS.escape(i+'|'+s)+'"]'); if(nd){nd.open=true;} ch.scrollIntoView({behavior:'smooth',block:'start'});});
document.getElementById('bOpen').onclick=()=>document.querySelectorAll('details.chain').forEach(d=>d.open=true);
document.getElementById('bClose').onclick=()=>document.querySelectorAll('details.chain').forEach(d=>{d.open=false; const p=d.querySelector('.panel'); if(p)p.innerHTML=''; d.querySelectorAll('details.node[open]').forEach(x=>x.open=false);});
function openSub(i,s){if(document.getElementById('only').checked){document.getElementById('only').checked=false;}
  let x=SUB[i+'|'+s]; if(x){const b=document.querySelector('#stf input[value="'+x.st+'"]'); if(b&&!b.checked){b.checked=true;}} draw();
  const ch=document.querySelector('.chain[data-i="'+CSS.escape(i)+'"]'); if(!ch)return; ch.open=true;
  if(s){const nd=ch.querySelector('details.node[data-k="'+CSS.escape(i+'|'+s)+'"]'); if(nd)nd.open=true;} else ch.scrollIntoView({behavior:'smooth',block:'start'});}
const REC=new Set((J.rec||[]).map(r=>r[0]));
function drawTop(){const T=J.theme; if(T&&T.b){const lk=it=>'<span class="lk" data-i="'+esc(it[0])+'" data-s="'+esc(it[1])+'">'+esc(it[1]||it[0])+(it[2]!=null?' '+fmt(it[2])+'%':'')+'</span>';
   document.getElementById('theme').innerHTML='<div class="tb"><h3>盤勢主軸:'+esc(T.title)+' <span class="sub" style="font-size:12px;font-weight:400">('+J.T+' 收盤,每天自動更新;點名稱看那個族群)</span></h3><ul>'+
   (T.dirs&&T.dirs.length?'</ul><table class="dirt"><thead><tr><th>族群</th><th>方向</th><th>子族群(狀態 · 20 日;發動→轉強→整理→落後)</th></tr></thead><tbody>'+
   T.dirs.map(d=>{const RK={'發動':0,'轉強':1,'整理':2,'落後':3}, ss=J.subs.filter(x=>x.i===d.i).sort((a,b)=>(RK[a.st]-RK[b.st])||(b.r20-a.r20)), cnt=k=>ss.filter(x=>x.st===k).length;
     return '<tr><td><span class="lk" data-i="'+esc(d.i)+'" data-s=""><b>'+esc(d.i)+'</b></span></td><td style="white-space:nowrap">發動 '+cnt('發動')+' · 轉強 '+cnt('轉強')+' · 整理 '+cnt('整理')+' · 落後 '+cnt('落後')+'</td><td>'+
     ss.map(x=>'<span style="display:inline-block;margin:2px 10px 2px 0;white-space:nowrap"><span class="pill '+(PILL[x.st]||'p-mid')+'">'+x.st+'</span> <span class="lk" data-i="'+esc(x.i)+'" data-s="'+esc(x.s)+'">'+esc(x.s)+' '+fmt(x.r20)+'%</span></span>').join('')+'</td></tr>';}).join('')+'</tbody></table><ul style="margin-top:8px">':'')+
   T.b.filter(b=>b.h!=='最強的子產業'&&b.h!=='發動集中在').map(b=>'<li><b>'+esc(b.h)+'</b>:'+esc(b.t)+(b.it.length?' '+b.it.map(lk).join('、'):'')+'</li>').join('')+'</ul></div>';}
  const R=J.rec||[]; if(R.length){const by={};R.forEach(r=>{const v=J.stock[r[0]];const k=v?v[1]+'|'+v[2]:'|';(by[k]=by[k]||[]).push(r[0]);});
   document.getElementById('recbox').innerHTML='<div class="tb"><h3>📼 '+(J.recD||'明天')+' 盤中錄製:產業鏈發動/轉強 '+R.length+' 檔 <span class="sub" style="font-size:12px;font-weight:400">(點股票跳到它的子產業;成分股表裡 📼 = 會錄)</span></h3>'+
   Object.keys(by).map(k=>{const [i,s]=k.split('|');const x=SUB[k];return '<div style="margin:4px 0"><span class="lk" data-i="'+esc(i)+'" data-s="'+esc(s)+'">'+esc(s)+'</span> <span class="sub">'+esc(i)+(x?' · '+x.st+' '+fmt(x.r20)+'%':'')+'</span>:'+
     by[k].map(c=>'<span class="rc" data-i="'+esc(i)+'" data-s="'+esc(s)+'">'+c+' '+esc((J.stock[c]||[''])[0])+'</span>').join('')+'</div>';}).join('')+'</div>';}
  document.querySelectorAll('#theme .lk,#theme .rc,#recbox .lk,#recbox .rc').forEach(e=>e.onclick=()=>openSub(e.dataset.i,e.dataset.s));}
// 2026-10-05 點個股 → 撐壓卡(區間撐壓 / 5、10 日均 / 雙重撐壓 / 昨開高低),前日定;資料由 個股撐壓.py 算進 J.sr
function srCard(c){const r=(J.sr||{})[c], v=J.stock[c]||[''];
  let h='<span class="x" id="srx">關閉</span><b class="num">'+c+'</b> <b>'+esc(v[0])+'</b> <span class="sub">撐壓(前日定'+(r?' '+r.d:'')+';跟收盤比:紅=壓、綠=撐)</span>';
  if(!r) return h+'<div class="sub">沒有撐壓資料</div>';
  const p=r.c, tg=x=>x==null?'—':'<b class="num '+(x>p?'up':x<p?'dn':'')+'">'+x+'</b><span class="sub" style="font-size:11px">'+(x>p?'壓':x<p?'撐':'平')+'</span>';
  h+='<div>收盤 <b class="num">'+r.c+'</b></div>';
  h+='<div><b>區間撐壓</b> '+(r.sp!=null?'<span class="sub">起點</span> <b class="num">'+r.sp+'</b> <span class="sub">R</span> '+r.R+' · <span class="sub">壓</span> '+(r.P.map((x,i)=>'R'+(i+1)+' <b class="num up">'+x+'</b>').join(' / ')||'—')+' · <span class="sub">撐</span> '+(r.S.map((x,i)=>'R'+(i+1)+' <b class="num dn">'+x+'</b>').join(' / ')||'—'):'<span class="sub">沒有前一日 1 分K,算不出</span>')+'</div>';
  h+='<div><b>5/10 日均</b> <span class="sub">5MA</span> '+tg(r.m5)+' · <span class="sub">10MA</span> '+tg(r.m10)+' · <span class="sub">20MA</span> '+tg(r.m20)+' · <span class="sub">布林上軌</span> '+tg(r.bbu)+'</div>';
  h+='<div><b>雙重撐壓</b> '+(r.du?'<b>'+esc(r.du)+'</b>':'<span class="sub">沒有(均線沒落在 R 附近)</span>')+'</div>';
  h+='<div><b>昨開高低</b> <span class="sub">開</span> '+tg(r.yo)+' · <span class="sub">高</span> '+tg(r.yh)+' · <span class="sub">低</span> '+tg(r.yl)+'</div>';
  h+='<div class="sub" style="font-size:12px;line-height:1.6;margin-top:4px">區間撐壓跟 TradingView「R1/2/3 起點區間」、撐壓盯盤同一套:前一日第一根 5 分K 高低差=R,起點=最後一段。雙重撐壓=5/10/20MA、布林上軌落在哪一層 R(收盤 ×0.75% 內)。</div>';
  return h;}
function openSR(c){document.getElementById('srbox').innerHTML=srCard(c); const o=document.getElementById('srov'); o.style.display='flex'; document.getElementById('srx').onclick=()=>o.style.display='none';}
document.getElementById('srov').addEventListener('click',e=>{if(e.target.id==='srov')e.currentTarget.style.display='none';});
document.addEventListener('click',e=>{const t=e.target.closest('.sc'); if(!t)return; e.preventDefault(); e.stopPropagation(); openSR(t.dataset.c);},true);
drawTop(); draw(); drawAll();
</script>
