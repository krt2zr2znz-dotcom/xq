var MODE='day', FEN=null, LIVE=null, timer=null, bridgeOK=false;
var sel=document.getElementById('gsel'), grid=document.getElementById('grid'), hint=document.getElementById('hint');

// 台股盤中 = 週一~五 09:00~13:30(用戶端在台灣,本機時間=台北時間)
function mktOpen(){var d=new Date();var wd=d.getDay();if(wd<1||wd>5)return false;var t=d.getHours()*60+d.getMinutes();return t>=540&&t<=810;}
function setStatus(){
  var el=document.getElementById('stat'); el.style.display='block';
  if(MODE==='min'){
    if(bridgeOK){el.style.background='#173a2a';el.style.color='#7fe0a8';el.innerHTML='🟢 盤中即時 · XQ 橋接連線中(每 5 秒更新)· 個股走勢=今日分時';}
    else{el.style.background='#4a1d1d';el.style.color='#ffb3b3';el.innerHTML='🔴 XQ / 即時橋接未開啟 —— 目前顯示「'+(mktOpen()?'上一交易日':'當天')+'收盤」。要看盤中即時:請開 <b>一鍵_即時橋接.bat</b> + <b>XQ族群個股.xlsx</b>,並用 <b>http://localhost:8888/wall.html</b> 開本頁。';}
  }else{
    el.style.background='#16202b';el.style.color='#8a9bab';
    el.innerHTML=(mktOpen()?'⚪ 日線收盤(現在盤中,要即時請按「分時」)':'⚪ 已收盤 · 顯示當天收盤資料')+' · 近 60 交易日';
  }
}

DB.G.forEach(function(g,i){var o=document.createElement('option');o.value=i;o.textContent=g.g+' ('+g.m.length+' 檔)';sel.appendChild(o);});

// 大盤 + 櫃買:今日收盤面板(今日收盤/漲跌%/開高低 + 單根今日K),永遠顯示在最上、不隨族群切換而變
function candle(o,h,l,c,w,ht){
  var mn=l,mx=h,rng=(mx-mn)||1;
  function y(v){return 8+(ht-16)*(1-(v-mn)/rng);}
  var up=c>=o,col=up?'#ff5d5d':'#3ec77a',cx=w/2,bt=Math.min(y(o),y(c)),bb=Math.max(y(o),y(c));
  return '<svg width="'+w+'" height="'+ht+'" style="flex:none"><line x1="'+cx+'" y1="'+y(h).toFixed(1)+'" x2="'+cx+'" y2="'+y(l).toFixed(1)+'" stroke="'+col+'" stroke-width="1.5"/><rect x="'+(cx-11)+'" y="'+bt.toFixed(1)+'" width="22" height="'+Math.max(2,bb-bt).toFixed(1)+'" fill="'+col+'"/></svg>';
}
function drawIdx(){
  ['加權','櫃買'].forEach(function(k){
    var d=DB.CH&&DB.CH[k], el=document.getElementById('idx'+k); if(!el)return;
    if(!d||!d.c||d.c.length<2){el.innerHTML='<div class="na">'+k+'指數 資料未更新</div>';return;}
    var n=d.c.length,c=d.c[n-1],pv=d.c[n-2],o=d.o[n-1],hi=d.h[n-1],lo=d.l[n-1];
    var chg=c-pv,pct=pv?chg/pv*100:0,cl=chg>0?'pos':(chg<0?'neg':'flat');
    el.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px">'
      +'<div style="min-width:0"><div style="font-size:12px;color:var(--mut)">'+k+'指數 · 今日收盤 ('+d.d[n-1]+')</div>'
      +'<div style="font-size:26px;font-weight:bold" class="'+cl+'">'+c.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</div>'
      +'<div class="'+cl+'" style="font-size:14px;font-weight:bold">'+(chg>0?'▲ +':'▼ ')+Math.abs(chg).toFixed(2)+' ('+(pct>0?'+':'')+pct.toFixed(2)+'%)</div>'
      +'<div style="font-size:12px;color:var(--mut);margin-top:5px">開 '+o.toLocaleString()+' · 高 '+hi.toLocaleString()+' · 低 '+lo.toLocaleString()+'</div></div>'
      +candle(o,hi,lo,c,54,96)+'</div>';
  });
}

function qp(k){var m=new RegExp('[?&]'+k+'=([^&]+)').exec(location.search);return m?decodeURIComponent(m[1]):null;}
function color(v){return v>0?'pos':(v<0?'neg':'flat');}

function chgOf(code){
  if(MODE==='min'&&LIVE&&LIVE[code]&&LIVE[code].c!=null) return LIVE[code].c;   // 即時漲幅%
  var px=DB.PX[code]; return px?px.chg:0;                                       // 當日漲跌幅%
}
function seriesOf(code){
  if(MODE==='min'&&FEN&&FEN[code]&&FEN[code].length>1) return FEN[code];        // 盤中分時
  var px=DB.PX[code]; return px?px.c:null;                                      // 日線收盤
}

function spark(arr,w,h,pad){
  if(!arr||arr.length<2) return '<div class="na">資料未更新</div>';
  var mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),rng=(mx-mn)||1,n=arr.length,pts=[];
  for(var i=0;i<n;i++){var x=pad+(w-2*pad)*i/(n-1);var y=pad+(h-2*pad)*(1-(arr[i]-mn)/rng);pts.push(x.toFixed(1)+','+y.toFixed(1));}
  var up=arr[n-1]>=arr[0],col=up?'#ff5d5d':'#3ec77a',base=pad+(h-2*pad)*(1-(arr[0]-mn)/rng);
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
    +'<line x1="'+pad+'" y1="'+base.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+base.toFixed(1)+'" stroke="#3a4655" stroke-width="1" stroke-dasharray="3,3"/>'
    +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.6"/></svg>';
}

function render(){
  var gi=+sel.value, g=DB.G[gi]; grid.innerHTML='';
  var mem=g.m.slice().sort(function(a,b){return chgOf(b)-chgOf(a);});   // 依當前模式漲跌重排
  hint.textContent=g.g+' · '+g.m.length+' 檔 · 依漲跌排序 · 點格看走勢';
  mem.forEach(function(code){
    var px=DB.PX[code]||{}, arr=seriesOf(code), ch=chgOf(code), rs=DB.RS[code];
    var d=document.createElement('div'); d.className='cell'; d.setAttribute('data-c',code);
    d.innerHTML='<div class="hd"><span class="nm">'+(px.n||'')+' <span class="cd">'+code+'</span>'+(rs!=null?'<span class="rs">RS'+rs+'</span>':'')+'</span>'
      +'<span class="pc '+color(ch)+'">'+((ch>0?'+':'')+(ch||0).toFixed(2))+'%</span></div>'
      +spark(arr,150,64,4);
    grid.appendChild(d);
  });
}

grid.addEventListener('click',function(e){
  var cell=e.target.closest('.cell'); if(!cell)return;
  var code=cell.getAttribute('data-c'),px=DB.PX[code]||{},arr=seriesOf(code),ch=chgOf(code),rs=DB.RS[code];
  document.getElementById('oT').innerHTML=code+' '+(px.n||'')+(rs!=null?' <span class="rs">RS'+rs+'</span>':'')+' <span class="'+color(ch)+'">'+((ch>0?'+':'')+(ch||0).toFixed(2))+'%</span>';
  document.getElementById('oSvg').innerHTML=spark(arr,760,320,10);
  document.getElementById('oB').href='broker.html?code='+code;
  document.getElementById('oInfo').textContent=(MODE==='min'?'分時':'日線 近 '+((px.c||[]).length)+' 日')+(px.c?(' · 收 '+px.c[px.c.length-1]):'');
  document.getElementById('ov').style.display='flex';
});
document.getElementById('oX').onclick=function(){document.getElementById('ov').style.display='none';};
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)this.style.display='none';});

sel.addEventListener('change',render);
document.getElementById('mDay').onclick=function(){MODE='day';this.classList.add('on');document.getElementById('mMin').classList.remove('on');stopPoll();render();setStatus();};
document.getElementById('mMin').onclick=function(){MODE='min';this.classList.add('on');document.getElementById('mDay').classList.remove('on');startPoll();};

function fetchJSON(u){return fetch(u,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}
function pull(){
  // 盤中抓 bridge 即時(/intraday.json + /prices.json);抓不到→bridgeOK=false→退收盤+紅字警示
  Promise.all([fetchJSON('intraday.json'),fetchJSON('prices.json')]).then(function(a){
    var intr=a[0],pr=a[1];
    bridgeOK=!!(intr||pr);
    if(intr&&intr.series) FEN=intr.series;
    if(pr&&pr.prices) LIVE=pr.prices;
    if(!bridgeOK){
      return fetchJSON('fenshi_today.json').then(function(j){if(j&&(j.series||Object.keys(j).length)){FEN=j.series||j;}render();setStatus();});
    }
    render();setStatus();
  });
}
function startPoll(){pull();if(timer)clearInterval(timer);timer=setInterval(pull,5000);}
function stopPoll(){if(timer){clearInterval(timer);timer=null;}}

(function init(){
  var qg=qp('g'),qc=qp('code'),pick=0;
  if(qg){for(var i=0;i<DB.G.length;i++)if(DB.G[i].g===qg){pick=i;break;}}
  else if(qc){for(var i=0;i<DB.G.length;i++)if(DB.G[i].m.indexOf(qc)>=0){pick=i;break;}}
  sel.value=pick; drawIdx();
  // 盤中→預設分時(即時);盤後→預設日線(當天收盤)
  if(mktOpen()){MODE='min';document.getElementById('mMin').classList.add('on');document.getElementById('mDay').classList.remove('on');render();startPoll();}
  else{MODE='day';render();setStatus();}
})();
