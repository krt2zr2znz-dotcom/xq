function val(id){return parseFloat(document.getElementById(id).value)||0}
function pass(s){
 if(on('zb')&&!s.zb)return false;
 if(on('lb')&&!s.lb)return false;
 if(on('zt')&&!s.zt)return false;
 if(on('nzt')&&s.zt)return false;
 if(on('ztk')&&!s.ztk)return false;
 if(on('xh')&&!s.xh)return false;
 if(on('kd')&&!(s.k>val('kv')))return false;
 if(on('gp')&&!(s.gap!=null&&s.gap>val('gv')))return false;
 return true;
}
var sortKey='gap',sortDir=-1;
function render(){
 var rows=DATA.filter(pass);
 rows.sort(function(a,b){var x=a[sortKey],y=b[sortKey];if(x==null)x=-999;if(y==null)y=-999;return (x>y?1:x<y?-1:0)*sortDir});
