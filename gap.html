function on(id){return document.getElementById(id).checked}
function val(id){return parseFloat(document.getElementById(id).value)||0}
function pass(s){
 if(on('zb')&&!s.zb)return false; if(on('lb')&&!s.lb)return false;
 if(on('zt')&&!s.zt)return false; if(on('nzt')&&s.zt)return false;
 if(on('ztk')&&!s.ztk)return false; if(on('xh')&&!s.xh)return false;
 if(on('kd')&&!(s.k>val('kv')))return false;
 if(on('gp')&&!(s.gap!=null&&s.gap>val('gv')))return false; return true;
}
function levels(s){ // 起點=收盤;±1/2/3 R;漲停跌停±10%封頂
 if(s.R==null)return null;
 var up=s.px*1.1, dn=s.px*0.9;
 var P=[1,2,3].map(function(n){return Math.min(s.px+n*s.R,up)});
 var S=[1,2,3].map(function(n){return Math.max(s.px-n*s.R,dn)});
 return {P:P,S:S};
}
function f(v){return v==null?'-':v.toFixed(2)}
var sortKey='gap',sortDir=-1;
function render(){
 var rows=DATA.filter(pass);
 rows.sort(function(a,b){var x=a[sortKey],y=b[sortKey];if(x==null)x=-1e9;if(y==null)y=-1e9;return (x>y?1:x<y?-1:0)*sortDir});
 var h='';
 for(var i=0;i<rows.length;i++){var s=rows[i];var L=levels(s);
  var pcell=L?('<span class="press">'+f(L.P[0])+' / '+f(L.P[1])+' / '+f(L.P[2])+'</span>'):'-';
  var scell=L?('<span class="supp">'+f(L.S[0])+' / '+f(L.S[1])+' / '+f(L.S[2])+'</span>'):'-';
  h+='<tr><td class="c">'+s.c+'</td><td>'+s.nm+'</td><td class="n">'+f(s.px)+'</td>'+
     '<td class="n '+(s.chg>0?'up':'dn')+'">'+(s.chg>0?'+':'')+s.chg.toFixed(2)+'</td>'+
     '<td class="n">'+s.k.toFixed(1)+'</td><td class="n hl">'+(s.gap!=null?s.gap.toFixed(2):'-')+'</td>'+
     '<td class="n">'+f(s.h5)+'</td><td class="n">'+f(s.l5)+'</td><td class="n hl">'+f(s.R)+'</td>'+
     '<td class="n">'+pcell+'</td><td class="n">'+scell+'</td></tr>';
 }
 document.getElementById('tb').innerHTML=h||'<tr><td colspan=11 style="text-align:center;color:#8aa1bd;padding:14px">— 無符合,放寬條件 —</td></tr>';
 document.getElementById('cnt').textContent=rows.length;
}
function preset(p){
 ['zb','lb','zt','nzt','ztk','xh','kd','gp'].forEach(function(i){document.getElementById(i).checked=false});
 if(p=='5.1'){zb.checked=zt.checked=kd.checked=gp.checked=true;kv.value=80;gv.value=4;}
 if(p=='5.2'){zb.checked=xh.checked=nzt.checked=kd.checked=gp.checked=true;kv.value=85;gv.value=4;}
 if(p=='5.3'){lb.checked=ztk.checked=zt.checked=kd.checked=gp.checked=true;kv.value=80;gv.value=4;}
 render();
}
function sortBy(k){if(sortKey==k)sortDir*=-1;else{sortKey=k;sortDir=-1}render();}
window.onload=function(){document.querySelectorAll('input').forEach(function(el){el.addEventListener('input',render)});render();};
