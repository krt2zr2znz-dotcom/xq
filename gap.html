<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>差價區間選股 · 2026-08-18</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1826;color:#e8f0fb;font:14px/1.5 -apple-system,'Noto Sans TC',Segoe UI,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
.top{background:linear-gradient(90deg,#16324f,#132437);border-radius:12px;padding:14px 20px;margin-bottom:12px}
.top h1{margin:0;font-size:20px}.top .d{color:#8aa1bd;font-size:13px;margin-top:4px}
.panel{background:#132437;border:1px solid #22384f;border-radius:10px;padding:12px 16px;margin-bottom:12px}
.presets{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.presets button{background:#1c3a59;color:#e8f0fb;border:1px solid #2b4a68;border-radius:8px;padding:6px 14px;cursor:pointer}
.presets button:hover{background:#245079}
.conds{display:flex;gap:12px 20px;flex-wrap:wrap;align-items:center}
label.ck{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}label.ck input{width:17px;height:17px;accent-color:#4aa3ff}
.num{display:flex;align-items:center;gap:6px}.num input{width:54px;background:#0f2135;border:1px solid #2b4a68;color:#e8f0fb;border-radius:6px;padding:4px 6px;text-align:right}
.cnt{color:#ffd24a;font-weight:700}
.tb-scroll{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;background:#132437;font-size:13px;min-width:1460px;width:100%}
th{background:#0f2135;color:#8aa1bd;text-align:right;padding:7px 9px;cursor:pointer;white-space:nowrap;position:sticky;top:0}
th:first-child,th:nth-child(2){text-align:left}
td{padding:6px 9px;border-top:1px solid #22384f;white-space:nowrap}
td.c{color:#4aa3ff;font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}
.up{color:#ff5b6a}.dn{color:#4bd07f}.hl{color:#ffd24a;font-weight:700}
.press{color:#ff8a95}.supp{color:#7fe0a3}.yiz{background:#ffd24a;color:#12233a;font-weight:800;border-radius:4px}
th.pg{color:#ff8a95}th.sg{color:#7fe0a3}
tbody tr:nth-child(even){background:#0f2033}
.foot,.leg{color:#8aa1bd;font-size:12px;margin-top:10px}</style><div class="wrap"><div class="top"><h1>差價區間選股</h1><div class="d">2026-08-18 · R=第一根5分K高−低 · 起點=收盤 · R1~R3壓/撐 · 開=收(一字)反白</div></div><div class="panel"><div class="presets">一鍵套用:<button onclick="preset('5.1')">5.1</button><button onclick="preset('5.2')">5.2</button><button onclick="preset('5.3')">5.3</button><span style="color:#8aa1bd">符合 <span class="cnt" id="cnt">0</span> 檔</span></div><div class="conds"><label class="ck"><input type="checkbox" id="zb">站上布林</label><label class="ck"><input type="checkbox" id="lb">臨近布林</label><label class="ck"><input type="checkbox" id="zt">漲停</label><label class="ck"><input type="checkbox" id="nzt">非漲停</label><label class="ck"><input type="checkbox" id="ztk">漲停開門</label><label class="ck"><input type="checkbox" id="xh">隔日續紅</label><label class="ck"><input type="checkbox" id="yz">一字(開=收)</label><span class="num"><label class="ck"><input type="checkbox" id="kd">KD&gt;</label><input id="kv" value="80"></span><span class="num"><label class="ck"><input type="checkbox" id="gp">差價%&gt;</label><input id="gv" value="4"></span></div></div><div class="tb-scroll"><table><thead><tr><th onclick="sortBy('c')">代碼</th><th>名稱</th><th onclick="sortBy('op')">開盤</th><th onclick="sortBy('px')">收盤</th><th onclick="sortBy('chg')">漲跌%</th><th onclick="sortBy('k')">K</th><th onclick="sortBy('gap')">差價%</th><th onclick="sortBy('h5')">5K高</th><th onclick="sortBy('l5')">5K低</th><th onclick="sortBy('R')">R價差</th><th class="pg" onclick="sortBy('p1')">R1壓</th><th class="pg" onclick="sortBy('p2')">R2壓</th><th class="pg" onclick="sortBy('p3')">R3壓</th><th class="sg" onclick="sortBy('s1')">R1撐</th><th class="sg" onclick="sortBy('s2')">R2撐</th><th class="sg" onclick="sortBy('s3')">R3撐</th></tr></thead><tbody id="tb"></tbody></table></div><script>
var DATA=[{"c": "0057", "nm": "富邦摩台", "op": 316.95, "px": 315.0, "chg": -1.45, "k": 82.4, "bu": null, "gap": null, "h5": null, "l5": null, "R": null, "zt": false, "ztk": false, "xh": false, "zb": false, "lb": false}, {"c": "1102", "nm": "亞泥", "op": 33.3, "px": 33.3, "chg": -0.45, "k": 81.8, "bu": null, "gap": null, "h5": null, "l5": null, "R": null, "zt": false, "ztk": false, "xh": false, "zb": false, "lb": false}, {"c": "1201", "nm": "味全", "op": 12.2, "px": 12.2, "chg": -0.41, "k": 83.3, "bu": null, "gap": null, "h5": null, "l5": null, "R": null, "zt": false, "ztk": false, "xh": false, "zb": false, "lb": false}, {"c": "1217", "nm": "愛之味", "op": 9.99, "px": 9.93, "chg": -0.5, "k": 85.9, "bu": null, "gap": null, "h5": null, "l5": null, "R": null, "zt": false, "ztk": false, "xh": false, "zb": false, "lb": false}, {"c": "1219", "nm": "福壽", "op": 11.2, "px": 11.2, "chg": -0.0, "k": 97.8, "bu": null, "gap": null, "h5": null, "l5": null, "R": null, "zt": false, "ztk": false, "xh": false, "zb": false, "lb": false}];
function on(id){return document.getElementById(id).checked}
function val(id){return parseFloat(document.getElementById(id).value)||0}
function pass(s){
 if(on('zb')&&!s.zb)return false; if(on('lb')&&!s.lb)return false;
 if(on('zt')&&!s.zt)return false; if(on('nzt')&&s.zt)return false;
 if(on('ztk')&&!s.ztk)return false; if(on('xh')&&!s.xh)return false;
 if(on('kd')&&!(s.k>val('kv')))return false;
 if(on('gp')&&!(s.gap!=null&&s.gap>val('gv')))return false;
 if(on('yz')&&!(s.op===s.px))return false; return true;
}
function lv(s){ if(s.R==null)return null; var up=s.px*1.1,dn=s.px*0.9;
 return {P:[1,2,3].map(function(n){return Math.min(s.px+n*s.R,up)}),S:[1,2,3].map(function(n){return Math.max(s.px-n*s.R,dn)})};}
function f(v){return v==null?'-':v.toFixed(2)}
var sortKey='gap',sortDir=-1;
function keyval(s,k){
 if(k=='p1'||k=='p2'||k=='p3'){var L=lv(s);return L?L.P[{p1:0,p2:1,p3:2}[k]]:null;}
 if(k=='s1'||k=='s2'||k=='s3'){var L=lv(s);return L?L.S[{s1:0,s2:1,s3:2}[k]]:null;}
 return s[k];
}
function render(){
 var rows=DATA.filter(pass);
 rows.sort(function(a,b){var x=keyval(a,sortKey),y=keyval(b,sortKey);if(x==null)x=-1e9;if(y==null)y=-1e9;return (x>y?1:x<y?-1:0)*sortDir});
 var h='';
 for(var i=0;i<rows.length;i++){var s=rows[i];var L=lv(s);var yz=(s.op===s.px);var oc=yz?' yiz':'';
  var P=L?L.P:[null,null,null],S=L?L.S:[null,null,null];
  h+='<tr><td class="c">'+s.c+'</td><td>'+s.nm+(yz?' <span class="yiz" style="padding:0 4px">一字</span>':'')+'</td>'+
     '<td class="n'+oc+'">'+f(s.op)+'</td><td class="n'+oc+'">'+f(s.px)+'</td>'+
     '<td class="n '+(s.chg>0?'up':'dn')+'">'+(s.chg>0?'+':'')+s.chg.toFixed(2)+'</td>'+
     '<td class="n">'+s.k.toFixed(1)+'</td><td class="n hl">'+(s.gap!=null?s.gap.toFixed(2):'-')+'</td>'+
     '<td class="n">'+f(s.h5)+'</td><td class="n">'+f(s.l5)+'</td><td class="n hl">'+f(s.R)+'</td>'+
     '<td class="n press">'+f(P[0])+'</td><td class="n press">'+f(P[1])+'</td><td class="n press">'+f(P[2])+'</td>'+
     '<td class="n supp">'+f(S[0])+'</td><td class="n supp">'+f(S[1])+'</td><td class="n supp">'+f(S[2])+'</td></tr>';
 }
 document.getElementById('tb').innerHTML=h||'<tr><td colspan=16 style="text-align:center;color:#8aa1bd;padding:14px">— 無符合,放寬條件 —</td></tr>';
 document.getElementById('cnt').textContent=rows.length;
}
function preset(p){
 ['zb','lb','zt','nzt','ztk','xh','kd','gp','yz'].forEach(function(i){document.getElementById(i).checked=false});
 if(p=='5.1'){zb.checked=zt.checked=kd.checked=gp.checked=true;kv.value=80;gv.value=4;}
 if(p=='5.2'){zb.checked=xh.checked=nzt.checked=kd.checked=gp.checked=true;kv.value=85;gv.value=4;}
 if(p=='5.3'){lb.checked=ztk.checked=zt.checked=kd.checked=gp.checked=true;kv.value=80;gv.value=4;}
 render();
}
function sortBy(k){if(sortKey==k)sortDir*=-1;else{sortKey=k;sortDir=-1}render();}
window.onload=function(){document.querySelectorAll('input').forEach(function(el){el.addEventListener('input',render)});render();};
</script></div></html>
