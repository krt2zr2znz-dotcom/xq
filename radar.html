  for(var j=0;j<tds.length&&j<6;j++){var m=((tds[j].textContent||'').trim()).match(/^([0-9]{4,6})(?![0-9])/);
   if(m){var v=DM[m[1]];if(v){tds[j].appendChild(badge(v));n++;}break;}}}
 return n;}
function bar(){if(document.getElementById('dmbar'))return;var ks=Object.keys(DM);if(!ks.length)return;
 var a=ks.filter(function(c){return DM[c].k=='in'||DM[c].k=='next'}).length,b=ks.filter(function(c){return DM[c].k=='fc'}).length;
 var d=document.createElement('div');d.id='dmbar';d.title=RULE;
 d.setAttribute('style','font-size:15px;line-height:1.8;margin:4px 0 8px;padding:8px 12px;border-radius:6px;background:#fff4e6;color:#7a3e00;border:1px solid #ffc078;display:inline-block');
 var fcl=ks.filter(function(c){return DM[c].k=='fc'}).map(function(c){return DM[c].tip.split('|')[0]+' '+DM[c].t.replace('明天可能處置 ','')}).join(';');
 var inl=ks.filter(function(c){return (DM[c].k=='in'||DM[c].k=='next')&&c.length==4}).map(function(c){return DM[c].tip.split('|')[0]+'('+DM[c].t.replace('處置中 ','')+')'}).join('、');
 var at=ks.filter(function(c){return DM[c].k=='att'||DM[c].k=='fc2'}).length;d.textContent='🚫 處置中/明起處置 '+a+' 檔 · ★ 明天盤中可能處置 '+b+' 檔'+(fcl?':'+fcl:'')+' · 📋 注意股 '+at+' 檔(股票旁標籤可看觸發條件)';
 if(!document.querySelector('tbody tr')){var r=document.createElement('div');r.setAttribute('style','font-size:13px;margin-top:4px;color:#995c00');r.textContent=RULE;d.appendChild(r);}
 lst(d);
 var h=document.querySelector('h1');if(h&&h.parentNode)h.parentNode.insertBefore(d,h.nextSibling);else document.body.insertBefore(d,document.body.firstChild);}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function lst(d){/* 2026-10-07 使用者:「點這個可以列出來包含可能處置」→ 點摘要列 展開/收起 完整清單 */
 var G=[['fc','★ 明天盤中可能處置(明天收盤達條件 → 隔日起處置)'],['next','🚫 明天起處置'],['in','🚫 處置中'],['fc2','△ 注意中(再差 2 次注意)'],['att','📋 注意股(再被列注意幾次會處置)']];
 var h='';G.forEach(function(g){var cs=Object.keys(DM).filter(function(c){return DM[c].k==g[0]}).sort(function(a,b){return ((DM[a].n||0)-(DM[b].n||0))||(a<b?-1:1)});if(!cs.length)return;
  h+='<details style="margin:10px 0"><summary style="font-weight:800;font-size:19px;cursor:pointer;padding:6px 0;border-bottom:2px solid #ffc078">'+g[1]+' '+cs.length+' 檔</summary>'+cs.map(function(c){var v=DM[c],p=(v.tip||'').split('|'),nm=p[0]||c,det=p.slice(1).filter(function(x){return x&&x.indexOf('規則:')!==0}).join(' · ');
   return '<div style="padding:8px 0;border-bottom:1px dashed #ffd8a8;line-height:1.7">'+(v.k=='fc'?'<b style="color:#d9480f">★ </b>':'')+'<b class="sc" data-c="'+esc(c)+'" style="cursor:pointer;text-decoration:underline">'+esc(nm)+'</b> <span style="font-weight:600">'+esc(v.t)+'</span><div style="color:#8a5a14;font-size:13.5px;margin-top:2px">'+esc(det).slice(0,300)+'</div></div>'}).join('')+'</details>'});
 if(!h)return;
 var pn=document.createElement('div');pn.id='dmlist';pn.setAttribute('style','display:none;margin-top:6px;max-height:60vh;overflow:auto;cursor:auto;font-size:15px;color:#3b2a10;min-width:min(560px,86vw)');pn.innerHTML=h+'<div style="font-size:13px;margin-top:6px;color:#995c00">'+esc(RULE)+'</div>';
 d.appendChild(document.createTextNode(' ▾ 點我列出清單'));d.style.cursor='pointer';d.appendChild(pn);
 d.addEventListener('click',function(e){if(pn.contains(e.target))return;pn.style.display=pn.style.display=='none'?'block':'none';});}
var busy=false;function run(){if(busy)return;busy=true;try{mark();bar();}catch(e){}busy=false;}
function boot(){run();try{var t=null;new MutationObserver(function(){clearTimeout(t);t=setTimeout(run,150);}).observe(document.body,{childList:true,subtree:true});}catch(e){}}
if(document.readyState=='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();</script></body></html>
