 var G=[['fc','★ 明天盤中可能處置(明天收盤達條件 → 隔日起處置)'],['next','🚫 明天起處置'],['in','🚫 處置中'],['fc2','△ 注意中(再差 2 次注意)'],['att','📋 注意股(再被列注意幾次會處置)']];
 var h='';G.forEach(function(g){var cs=Object.keys(DM).filter(function(c){return DM[c].k==g[0]}).sort(function(a,b){return ((DM[a].n||0)-(DM[b].n||0))||(a<b?-1:1)});if(!cs.length)return;
  h+='<details style="margin:10px 0"><summary style="font-weight:800;font-size:19px;cursor:pointer;padding:6px 0;border-bottom:2px solid #ffc078">'+g[1]+' '+cs.length+' 檔</summary>'+cs.map(function(c){var v=DM[c],p=(v.tip||'').split('|'),nm=p[0]||c,det=p.slice(1).filter(function(x){return x&&x.indexOf('規則:')!==0}).join(' · ');
   return '<div style="padding:8px 0;border-bottom:1px dashed #ffd8a8;line-height:1.7">'+(v.k=='fc'?'<b style="color:#d9480f">★ </b>':'')+'<b class="sc" data-c="'+esc(c)+'" style="cursor:pointer;text-decoration:underline">'+esc(nm)+'</b> <span style="font-weight:600">'+esc(v.t)+'</span><div style="color:#8a5a14;font-size:13.5px;margin-top:2px">'+esc(det).slice(0,300)+'</div></div>'}).join('')+'</details>'});
 if(!h)return;
 var pn=document.createElement('div');pn.id='dmlist';pn.setAttribute('style','display:none;margin-top:6px;max-height:60vh;overflow:auto;cursor:auto;font-size:15px;color:#3b2a10;min-width:min(560px,86vw)');pn.innerHTML=h+'<div style="font-size:13px;margin-top:6px;color:#995c00">'+esc(RULE)+'</div>';
 /* 2026-10-20 使用者:「這個點不開」→ 改成真的按鈕(手機 / App / TG 內建瀏覽器都點得到),整條摘要列也照樣可以點 */
 var bt=document.createElement('button');bt.type='button';bt.textContent='▾ 點我列出清單';
 bt.setAttribute('style','display:block;margin-top:6px;font-size:15px;font-weight:700;padding:6px 14px;border-radius:6px;border:1px solid #d9480f;background:#fff;color:#d9480f;cursor:pointer;touch-action:manipulation');
 d.style.cursor='pointer';d.appendChild(bt);d.appendChild(pn);
 var tg=function(){var o=pn.style.display=='none';pn.style.display=o?'block':'none';bt.textContent=o?'▴ 收起清單':'▾ 點我列出清單';};
 bt.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();tg();});
 d.addEventListener('click',function(e){if(pn.contains(e.target)||bt.contains(e.target))return;tg();});}
var busy=false;function run(){if(busy)return;busy=true;try{mark();bar();}catch(e){}busy=false;}
function boot(){run();try{var t=null;new MutationObserver(function(){clearTimeout(t);t=setTimeout(run,150);}).observe(document.body,{childList:true,subtree:true});}catch(e){}}
if(document.readyState=='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();</script></body></html>
