var VIEW=DATA.slice(), sortK='chg', sortDesc=true;
function numOr(id){var v=document.getElementById(id).value.trim();return v===''?null:parseFloat(v);}
function chk(id){return document.getElementById(id).checked;}
function pass(r){
  var bo=numOr('bbOver'); if(bo!=null && !(r.bo!=null && r.bo>=bo)) return false;
  var bn=numOr('bbNear'); if(bn!=null && !(r.bn!=null && r.bn>=0 && r.bn<=bn)) return false;
  var bp=document.getElementById('bbPos').value; if(bp && r.pos!==bp) return false;
  var zt=chk('zt'), nzt=chk('nzt'); if(zt||nzt){ if(!((zt&&r.zt)||(nzt&&!r.zt))) return false; }
  if(chk('zto') && !r.ztk) return false;
  if(chk('dto') && !r.dtk) return false;
  var rgN=numOr('rgN');
  if(rgN!=null){var _rg=(document.querySelector('input[name=rg]:checked')||{}).value;
    if(_rg==='r'){ if(!(r.rn>=rgN)) return false; } else { if(!(r.gn>=rgN)) return false; }}
  var vv=numOr('vol'); if(vv!=null && !(r.vol!=null && r.vol>=vv)) return false;
  var gp=numOr('gap'); if(gp!=null && !(r.gap!=null && r.gap>gp)) return false;
  if(chk('hideDisp') && r.disp) return false;
  var h6v=numOr('h6Val'); if(h6v!=null){var x=r.h6[document.getElementById('h6Lot').value];if(x==null)return false;if(!(document.getElementById('h6Op').value==='gt'?x>h6v:x<h6v))return false;}
  var w1v=numOr('w1Val'); if(w1v!=null){var y=r.w1[document.getElementById('w1Lot').value];if(y==null)return false;if(!(document.getElementById('w1Op').value==='gt'?y>w1v:y<w1v))return false;}
  if(META.hasConc){
    var c5v=numOr('c5Val'); if(c5v!=null){if(r.c5==null)return false;if(!(document.getElementById('c5Op').value==='gt'?r.c5>c5v:r.c5<c5v))return false;}
    var c20v=numOr('c20Val'); if(c20v!=null){if(r.c20==null)return false;if(!(document.getElementById('c20Op').value==='gt'?r.c20>c20v:r.c20<c20v))return false;}
  }
  return true;
}

 for(var i=0;i<trs.length;i++){var tr=trs[i];if(tr.querySelector('.dmk'))continue;var tds=tr.children;
  for(var j=0;j<tds.length&&j<6;j++){var m=((tds[j].textContent||'').trim()).match(/^([0-9]{4,6})(?![0-9])/);
   if(m){var v=DM[m[1]];if(v){tds[j].appendChild(badge(v));n++;}break;}}}
 return n;}
function bar(){if(document.getElementById('dmbar'))return;var ks=Object.keys(DM);if(!ks.length)return;
 var a=ks.filter(function(c){return DM[c].k=='in'||DM[c].k=='next'}).length,b=ks.filter(function(c){return DM[c].k=='fc'}).length;
 var d=document.createElement('div');d.id='dmbar';d.title=RULE;
 d.setAttribute('style','font-size:15px;line-height:1.8;margin:4px 0 8px;padding:8px 12px;border-radius:6px;background:#fff4e6;color:#7a3e00;border:1px solid #ffc078;display:inline-block;max-width:100%;box-sizing:border-box;overflow-wrap:anywhere');
 var fcl=ks.filter(function(c){return DM[c].k=='fc'}).map(function(c){return DM[c].tip.split('|')[0]+' '+DM[c].t.replace('明天可能處置 ','')}).join(';');
 var inl=ks.filter(function(c){return (DM[c].k=='in'||DM[c].k=='next')&&c.length==4}).map(function(c){return DM[c].tip.split('|')[0]+'('+DM[c].t.replace('處置中 ','')+')'}).join('、');
 var at=ks.filter(function(c){return DM[c].k=='att'||DM[c].k=='fc2'}).length;d.textContent='🚫 處置中/明起處置 '+a+' 檔 · ★ 明天盤中可能處置 '+b+' 檔'+(fcl?':'+fcl:'')+' · 📋 注意股 '+at+' 檔(股票旁標籤可看觸發條件)';
 if(!document.querySelector('tbody tr')){var r=document.createElement('div');r.setAttribute('style','font-size:13px;margin-top:4px;color:#995c00');r.textContent=RULE;d.appendChild(r);}
 lst(d);
 var h=document.querySelector('h1');if(h&&h.parentNode)h.parentNode.insertBefore(d,h.nextSibling);else document.body.insertBefore(d,document.body.firstChild);}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function lst(d){/* 2026-10-07 使用者:「點這個可以列出來包含可能處置」→ 點摘要列 展開/收起 完整清單 */
 var G=[['fc','★ 明天盤中可能處置(明天收盤達條件 → 隔日起處置)'],['next','🚫 明天起處置'],['in','🚫 處置中'],['fc2','△ 注意中(再差 2 次注意)'],['att','📋 注意股(再被列注意幾次會處置)']];
 var h='';G.forEach(function(g){var cs=Object.keys(DM).filter(function(c){return DM[c].k==g[0]}).sort(function(a,b){return ((DM[a].n||0)-(DM[b].n||0))||(a<b?-1:1)});if(!cs.length)return;
  h+='<details style="margin:10px 0"><summary style="font-weight:800;font-size:19px;cursor:pointer;padding:6px 0;border-bottom:2px solid #ffc078">'+g[1]+' '+cs.length+' 檔</summary>'+cs.map(function(c){var v=DM[c],p=(v.tip||'').split('|'),nm=p[0]||c,det=p.slice(1).filter(function(x){return x&&x.indexOf('規則:')!==0}).join(' · ');
   return '<div style="padding:8px 0;border-bottom:1px dashed #ffd8a8;line-height:1.7">'+(v.k=='fc'?'<b style="color:#d9480f">★ </b>':'')+'<b class="sc" data-c="'+esc(c)+'" style="cursor:pointer;text-decoration:underline">'+esc(nm)+'</b> <span style="font-weight:600">'+esc(v.t)+'</span><div style="color:#8a5a14;font-size:13.5px;margin-top:2px">'+esc(det).slice(0,300)+'</div></div>'}).join('')+'</details>'});
 if(!h)return;
 var pn=document.createElement('div');pn.id='dmlist';pn.setAttribute('style','display:none;margin-top:6px;max-height:60vh;overflow:auto;cursor:auto;font-size:15px;color:#3b2a10;min-width:min(560px,86vw)');pn.innerHTML=h+'<div style="font-size:13px;margin-top:6px;color:#995c00">'+esc(RULE)+'</div>';
 /* 2026-10-20 使用者:「這個點不開」→ 改成真的按鈕(手機 / App / TG 內建瀏覽器都點得到),整條摘要列也照樣可以點 */
 var bt=document.createElement('button');bt.type='button';bt.textContent='▾ 點我列出清單';
 bt.setAttribute('style','display:block;margin-top:6px;font-size:15px;font-weight:700;padding:6px 14px;border-radius:6px;border:1px solid #d9480f;background:#fff;color:#d9480f;cursor:pointer;touch-action:manipulation');
 d.style.cursor='pointer';d.appendChild(bt);d.appendChild(pn);
 var tg=function(){var o=pn.style.display=='none';pn.style.display=o?'block':'none';bt.textContent=o?'▴ 收起清單':'▾ 點我列出清單';};
 bt.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();tg();});
 d.addEventListener('click',function(e){if(pn.contains(e.target)||bt.contains(e.target))return;tg();});}
var busy=false;function run(){if(busy)return;busy=true;try{mark();bar();}catch(e){}busy=false;}
function boot(){run();try{var t=null;new MutationObserver(function(){clearTimeout(t);t=setTimeout(run,150);}).observe(document.body,{childList:true,subtree:true});}catch(e){}}
if(document.readyState=='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();</script></body></html>
