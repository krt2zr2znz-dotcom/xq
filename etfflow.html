function aggRange(d1,d2){var net={},cnt={},det={},nmof={};
 for(var i=0;i<P.dates.length;i++){var d=P.dates[i];if(d<d1||d>d2)continue;var o=P.data[d]||{};
  for(var etf in o){var x=o[etf];var cats=[['new',1],['add',1],['red',1],['del',-1]];
   for(var ci=0;ci<cats.length;ci++){var cat=cats[ci][0],sign=cats[ci][1];var arr=x[cat];
    for(var j=0;j<arr.length;j++){var code=arr[j][0],name=arr[j][1],v=sign*arr[j][2];nmof[code]=name;
     var gs=(P.c2g||{})[code]||[];
     for(var gi=0;gi<gs.length;gi++){var g=gs[gi];
      net[g]=(net[g]||0)+v;cnt[g]=(cnt[g]||0)+1;
      det[g]=det[g]||{};det[g][code]=det[g][code]||{v:0,e:{}};det[g][code].v+=v;det[g][code].e[etf]=1;}}}}}
 return {net:net,cnt:cnt,det:det,nmof:nmof};}
